[project]
name = "decoder"
version = "1.1.10"
requires-python = ">=3.11,<3.14"
description = "Decode lnurls."
authors = [{name = "Bitkarrot", email = "info@bitkarrot.co"}]

dependencies = [ "lnbits>=1.5.0", "pillow (>=12.3.0)", "aiohttp (>=3.14.4)", "cryptography>=50.0.2", "protobuf (>=6.33.5)" ]

# lnbits pins pillow (~=12.3.0) and packaging (~=25.0.0) to ranges that only
# contain versions with open CVEs (pillow fixed in 13.0.0; virtualenv>=21.14.9
# needs packaging>=26.3). bitstring 5.x removed ConstBitStream, which breaks
# bolt11 2.1.x (pinned by lnbits) at import time, so it is capped below 5.
# coincurve 20.0.0 (pinned by the bolt11/bip32 chain) has no cp313 wheels and
# its sdist no longer builds with current scikit-build-core; 21.x ships wheels. These overrides only affect the dev/test lock
# environment; production deployments use whatever versions lnbits provides.
[tool.uv]
override-dependencies = ["pillow>=13.0.0", "packaging>=26.3", "virtualenv>=21.14.9", "bitstring<5.0.0", "coincurve>=21.0.0"]

[dependency-groups]
dev = [
    "black",
    "pytest-asyncio",
    "pytest",
    "mypy==2.4.0",
    "pre-commit",
    "ruff",
]

[tool.poetry]
package-mode = false

[tool.mypy]
exclude = "(nostr/*)"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = [
  "lnbits.*",
  "lnurl.*",
  "loguru.*",
  "fastapi.*",
  "pydantic.*",
  "pyqrcode.*",
  "shortuuid.*",
  "httpx.*",
]
ignore_missing_imports = "True"

[tool.pytest.ini_options]
log_cli = false
testpaths = [
  "tests"
]

[tool.black]
line-length = 88

[tool.ruff]
# Same as Black. + 10% rule of black
line-length = 88
exclude = [
    "nostr",
]

[tool.ruff.lint]
# Enable:
# F - pyflakes
# E - pycodestyle errors
# W - pycodestyle warnings
# I - isort
# A - flake8-builtins
# C - mccabe
# N - naming
# UP - pyupgrade
# RUF - ruff
# B - bugbear
select = ["F", "E", "W", "I", "A", "C", "N", "UP", "RUF", "B"]
ignore = ["C901"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# needed for pydantic
[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "validator",
    "root_validator",
]

# Ignore unused imports in __init__.py files.
# [tool.ruff.lint.extend-per-file-ignores]
# "__init__.py" = ["F401", "F403"]

# [tool.ruff.lint.mccabe]
# max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
]
