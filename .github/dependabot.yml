version: 2
updates:
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # lnbits pins these below the available latest releases, so updates
      # at or beyond these ceilings can never resolve
      - dependency-name: 'protobuf'
        versions: ['>=6.34.0']
      - dependency-name: 'pyjwt'
        versions: ['>=2.13.0']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'
